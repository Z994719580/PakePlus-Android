        function saveDeviceConfig() {
            if (!currentDev) return;
            const oldDevName = currentDev.text;
            clearAllRemoteConnectionsToDevice(oldDevName);
            const devNameInput = document.getElementById("devNameInput");
            const devIpInput = document.getElementById("devIpInput");
            const devUCount = document.getElementById("devUCount");
            const devPortCount = document.getElementById("devPortCount");

            currentDev.text = devNameInput.value.trim();
            currentDev.deviceIp = devIpInput.value.trim();

            let uc = parseInt(devUCount.value) || 1;
            uc = Math.max(1, uc);
            let newEndU = currentDev.startU - (uc - 1);
            for (let dev of currentBlockList) {
                if (dev === currentDev) continue;
                if (isRangeOverlap(currentDev.startU, newEndU, dev.startU, dev.endU)) {
                    alert("修改占用U数后，与其他设备位置重叠，请调整U数量");
                    return;
                }
            }
            currentDev.endU = newEndU;
            sanitizeBlocks([currentDev]);
            currentDev.portCount = parseInt(devPortCount.value) || 0;
            fillDevicePorts(currentDev);

            if (currentDev.text !== oldDevName) {
                clearAllRemoteConnectionsToDevice(currentDev.text);
            }

            const portListWrap = document.getElementById("portListWrap");

            if (currentDev.devType === DEV_TYPE.KVM) {
                const rows = portListWrap.querySelectorAll(".row-item.kvm");
                currentDev.ports = [];
                rows.forEach(row => {
                    currentDev.ports.push({
                        portName: row.querySelector(".port-name-inp").value,
                        linkDev: row.querySelector(".link-dev").value,
                        remark: row.querySelector(".inp-remark").value
                    })
                })
            } else if (currentDev.devType === DEV_TYPE.ODF) {
                const rows = portListWrap.querySelectorAll(".row-item.odf:not(:first-child)");
                const portConfigs = [];
                let hasConflict = false;
                let conflictMsg = "";
                rows.forEach(row => {
                    const dstDev = row.querySelector(".dst-dev-select").value;
                    const dstPortName = row.querySelector(".dst-port-select").value;
                    const remark = row.querySelector(".inp-remark").value;
                    const portName = row.querySelector("input[readonly]").value;
                    if (dstDev && dstPortName) {
                        const occupied = isPortOccupied(dstDev, dstPortName, currentDev.text);
                        if (occupied) {
                            hasConflict = true;
                            conflictMsg += `${portName} → ${dstDev} ${dstPortName} 已被「${occupied.owner}」占用\n`;
                        }
                        const dup = portConfigs.find(p => p.dstDev === dstDev && p.dstPortName === dstPortName);
                        if (dup) {
                            hasConflict = true;
                            conflictMsg += `${portName} → ${dstDev} ${dstPortName} 已被本设备「${dup.portName}」占用\n`;
                        }
                    }
                    portConfigs.push({ portName, dstDev, dstPortName, remark });
                });
                if (hasConflict) {
                    alert("以下端口存在冲突，请调整后再保存：\n\n" + conflictMsg);
                    return;
                }
                currentDev.ports = [];
                portConfigs.forEach(p => {
                    currentDev.ports.push({
                        portName: p.portName,
                        dstDev: p.dstDev,
                        dstPortName: p.dstPortName,
                        remark: p.remark
                    });
                    if (p.dstDev && p.dstPortName) {
                        const remoteResult = findPortByDevAndPortName(p.dstDev, p.dstPortName);
                        if (remoteResult) {
                            const remotePort = remoteResult.port;
                            if (remoteResult.dev.devType === DEV_TYPE.AGG_SWITCH) {
                                remotePort.remark = p.remark || "";
                            }
                            remotePort.dstDev = currentDev.text;
                            remotePort.dstPortName = p.portName;
                        }
                    }
                });
            } else if (currentDev.devType === DEV_TYPE.NORMAL || currentDev.devType === DEV_TYPE
                .AGG_SWITCH) {
                const rows = portListWrap.querySelectorAll(".row-item.net:not(:first-child)");
                const isAgg = currentDev.devType === DEV_TYPE.AGG_SWITCH;
                let hasConflict = false;
                let conflictMsg = "";
                const portConfigs = [];
                rows.forEach(row => {
                    const dstDev = row.querySelector(".dst-dev-select").value;
                    const dstPortName = row.querySelector(".dst-port-select").value;
                    const portName = row.querySelector(".port-name-inp").value.trim() || `网口`;
                    const remark = row.querySelector(".inp-remark").value.trim();
                    if (dstDev && dstPortName) {
                        const occupied = isPortOccupied(dstDev, dstPortName, currentDev.text);
                        if (occupied) {
                            hasConflict = true;
                            conflictMsg += `${portName} → ${dstDev} ${dstPortName} 已被「${occupied.owner}」占用\n`;
                        }
                        const dup = portConfigs.find(p => p.dstDev === dstDev && p.dstPortName === dstPortName);
                        if (dup) {
                            hasConflict = true;
                            conflictMsg += `${portName} → ${dstDev} ${dstPortName} 已被本设备「${dup.portName}」占用\n`;
                        }
                    }
                    let localIp = "", localMask = "", dstIp = "", dstMask = "";
                    if (!isAgg) {
                        localIp = row.querySelector(".local-ip").value.trim();
                        localMask = row.querySelector(".local-mask").value.trim();
                        dstIp = row.querySelector(".dst-ip").value.trim();
                        dstMask = row.querySelector(".dst-mask").value.trim();
                    }
                    portConfigs.push({ portName, dstDev, dstPortName, remark, localIp, localMask, dstIp,
                        dstMask });
                });
                if (hasConflict) {
                    alert("以下端口存在冲突，请调整后再保存：\n\n" + conflictMsg);
                    return;
                }
                currentDev.ports = [];
                portConfigs.forEach(p => {
                    const portObj = {
                        portName: p.portName,
                        dstDev: p.dstDev,
                        dstPortName: p.dstPortName,
                        remark: p.remark
                    };
                    if (!isAgg) {
                        portObj.localIp = p.localIp;
                        portObj.localMask = p.localMask;
                        portObj.dstIp = p.dstIp;
                        portObj.dstMask = p.dstMask;
                    } else {
                        portObj.localIp = "";
                        portObj.localMask = "";
                        portObj.dstIp = "";
                        portObj.dstMask = "";
                    }
                    currentDev.ports.push(portObj);
                    if (p.dstDev && p.dstPortName) {
                        const remoteResult = findPortByDevAndPortName(p.dstDev, p.dstPortName);
                        if (remoteResult) {
                            const remotePort = remoteResult.port;
                            remotePort.remark = p.remark || "";
                            remotePort.dstDev = currentDev.text;
                            remotePort.dstPortName = p.portName || "";
                            if (!isAgg) {
                                remotePort.dstIp = p.localIp;
                                remotePort.dstMask = p.localMask;
                                remotePort.localIp = p.dstIp;
                                remotePort.localMask = p.dstMask;
                            }
                        }
                    }
                });
            }

            let savePowerMode = null;
            if (currentDev.devType === DEV_TYPE.NORMAL || currentDev.devType === DEV_TYPE.AGG_SWITCH) {
                savePowerMode = "dual";
            } else if (currentDev.text === "显示屏" || currentDev.devType === DEV_TYPE.KVM) {
                savePowerMode = "single";
            }

            if (savePowerMode) {
                const powerArea = document.querySelector(".power-setting-area");
                if (powerArea) {
                    currentDev.power1 = {
                        pdu: powerArea.querySelector(".power1-pdu")?.value || "",
                        port: powerArea.querySelector(".power1-port")?.value || ""
                    };
                    if (savePowerMode === "dual") {
                        currentDev.power2 = {
                            pdu: powerArea.querySelector(".power2-pdu")?.value || "",
                            port: powerArea.querySelector(".power2-port")?.value || ""
                        };
                    } else {
                        currentDev.power2 = null;
                    }
                }
                const powerConflicts = checkConflicts(currentDev, "power");
                if (powerConflicts.length > 0) {
                    alert("以下电源口已被其他设备占用，请调整后再保存：\n\n" + powerConflicts.join("\n"));
                    return;
                }
                const newDevName = currentDev.text;
                const allPdus = sideRightBlocks.filter(b => b.devType === DEV_TYPE.PDU);
                allPdus.forEach(pdu => {
                    fillDevicePorts(pdu);
                    pdu.ports.forEach(p => {
                        if (p.linkDev === oldDevName || p.linkDev === newDevName) {
                            p.linkDev = "";
                            p.linkPower = "";
                        }
                    });
                });
                if (currentDev.power1 && currentDev.power1.pdu && currentDev.power1.port) {
                    const pdu = sideRightBlocks.find(b => b.text === currentDev.power1.pdu && b
                    .devType === DEV_TYPE.PDU);
                    if (pdu) {
                        fillDevicePorts(pdu);
                        const port = pdu.ports.find(p => p.portName === "电源口" + currentDev
                        .power1.port);
                        if (port) { port.linkDev = newDevName;
                            port.linkPower = "电源1"; }
                    }
                }
                if (savePowerMode === "dual" && currentDev.power2 && currentDev.power2.pdu && currentDev
                    .power2.port) {
                    const pdu = sideRightBlocks.find(b => b.text === currentDev.power2.pdu && b
                    .devType === DEV_TYPE.PDU);
                    if (pdu) {
                        fillDevicePorts(pdu);
                        const port = pdu.ports.find(p => p.portName === "电源口" + currentDev
                        .power2.port);
                        if (port) { port.linkDev = newDevName;
                            port.linkPower = "电源2"; }
                    }
                }
            }

            if (currentDev.text === "空开插座") {
                const powerArea = document.querySelector(".power-setting-area");
                if (powerArea) {
                    currentDev.qf1Pdu = powerArea.querySelector(".qf1-pdu")?.value || "";
                    currentDev.qf2Pdu = powerArea.querySelector(".qf2-pdu")?.value || "";
                }
            }

            if (isSyncDevice(currentDev.text)) {
                syncDeviceConfig(currentDev, currentBlockList);
            }

            saveStorage();
            renderAll();
            closeModal();
        }

        function deleteDevice() {
            if (!currentDev || !currentBlockList) return;
            if (!confirm("确认要删除该设备？")) return;

            const devName = currentDev.text;

            clearAllRemoteConnectionsToDevice(devName);

            if (currentDev.devType === DEV_TYPE.NORMAL || currentDev.devType === DEV_TYPE.AGG_SWITCH || currentDev
                .text === "显示屏" || currentDev.devType === DEV_TYPE.KVM) {
                const allPdus = sideRightBlocks.filter(b => b.devType === DEV_TYPE.PDU);
                allPdus.forEach(pdu => {
                    fillDevicePorts(pdu);
                    pdu.ports.forEach(p => {
                        if (p.linkDev === devName) {
                            p.linkDev = "";
                            p.linkPower = "";
                        }
                    });
                });
            }

            if (isSyncDevice(devName)) {
                const counterpart = findCounterpartDevice(devName, currentBlockList);
                if (counterpart) {
                    const idx = counterpart.list.indexOf(counterpart.dev);
                    if (idx > -1) {
                        counterpart.list.splice(idx, 1);
                    }
                }
            }

            const idx = currentBlockList.indexOf(currentDev);
            if (idx > -1) {
                currentBlockList.splice(idx, 1);
            }

            saveStorage();
            closeModal();
            renderAll();
        }

        function closeModal() {
            modalMask.style.display = "none";
            currentDev = null;
            currentBlockList = null;
            currentCabinetId = null;
        }

        function renderUColumn(domId, topU, bottomU) {
            const dom = document.getElementById(domId);
            if (!dom) return;
            dom.innerHTML = "";
            const top = topU != null ? topU : TOP_U;
            const bottom = bottomU != null ? bottomU : BOTTOM_U;
            for (let u = top; u >= bottom; u--) {
                const div = document.createElement("div");
                div.className = "u-row";
                div.innerText = u;
                dom.appendChild(div);
            }
        }

        function renderDeviceColumn(domId, blockList, topU, bottomU, cabinetId) {
            const dom = document.getElementById(domId);
            if (!dom) return;
            dom.innerHTML = "";
            const blocks = blockList || [];
            const top = topU != null ? topU : TOP_U;
            const bottom = bottomU != null ? bottomU : BOTTOM_U;
            let ptrU = top;
            while (ptrU >= bottom) {
                const hit = blocks.find(b => ptrU <= b.startU && ptrU >= b.endU);
                if (hit) {
                    const spanRows = hit.startU - hit.endU + 1;
                    const el = document.createElement("div");
                    el.className = "dev-row";
                    el.style.height = (spanRows * U_HEIGHT) + "px";
                    if (hit.bg) el.style.background = hit.bg;
                    if (hit.text === "显示屏") {
                        el.innerHTML =
                            `<span style="font-size:42px;font-weight:bold;color:#0d47a1;letter-spacing:6px;">Goldwind</span>`;
                    } else {
                        el.innerHTML = hit.text;
                    }
                    el.classList.add("has-device");
                    el.onclick = () => openModal(hit, blocks, cabinetId);
                    dom.appendChild(el);
                    ptrU = hit.endU - 1;
                } else {
                    const emptyDiv = document.createElement("div");
                    emptyDiv.className = "dev-row empty-u";
                    emptyDiv.dataset.u = ptrU;
                    emptyDiv.ondblclick = function() {
                        const clickU = Number(this.dataset.u);
                        const newDev = addNewDeviceAtU(blocks, clickU);
                        if (newDev) {
                            openModal(newDev, blocks, cabinetId);
                        }
                    }
                    dom.appendChild(emptyDiv);
                    ptrU--;
                }
            }
        }

        function renderAll() {
            const frontTitle = document.getElementById("frontCabTitle");
            const sideTitle = document.getElementById("sideCabTitle");
            if (frontTitle && frontTitle.getAttribute("contenteditable") !== "true") frontTitle.innerText =
            frontCabName;
            if (sideTitle && sideTitle.getAttribute("contenteditable") !== "true") sideTitle.innerText = sideCabName;

            renderUColumn("frontUCol");
            renderDeviceColumn("frontDevCol", frontDevBlocks, TOP_U, BOTTOM_U, "front");

            renderUColumn("sideUCol");
            renderDeviceColumn("sideDevCol", sideDevBlocks, TOP_U, BOTTOM_U, "side");
            renderDeviceColumn("sideRightCol", sideRightBlocks, TOP_U, BOTTOM_U, "side");

            renderExtraCabinets();
        }

        function findAvailableColumn(startU, uCount, excludeId) {
            const topU = startU + uCount - 1;
            const bottomU = startU;
            const columns = {};
            extraCabinets.forEach(cab => {
                if (cab.id === excludeId) return;
                const col = cab.column != null ? cab.column : 2;
                if (!columns[col]) columns[col] = [];
                columns[col].push(cab);
            });
            const colIndices = Object.keys(columns).map(Number).sort((a, b) => a - b);
            for (let colIdx of colIndices) {
                const cabs = columns[colIdx];
                let conflict = false;
                for (let cab of cabs) {
                    const cabTop = cab.startU + cab.uCount - 1;
                    const cabBottom = cab.startU;
                    if (!(topU < cabBottom || bottomU > cabTop)) {
                        conflict = true;
                        break;
                    }
                }
                if (!conflict) return colIdx;
            }
            return null;
        }

        function autoAssignColumns() {
            const sorted = [...extraCabinets].sort((a, b) => (b.startU + b.uCount) - (a.startU + a.uCount));
            sorted.forEach(cab => {
                cab.column = 1;
            });
        }

        function deleteExtraCabinet(cabId) {
            if (!confirm("确认要删除该机柜及其所有设备吗？")) return;
            const idx = extraCabinets.findIndex(c => c.id === cabId);
            if (idx > -1) {
                extraCabinets.splice(idx, 1);
                saveStorage();
                renderAll();
            }
        }

        function renderExtraCabinets() {
            document.querySelectorAll(".cabinet-column.dynamic-column").forEach(el => el.remove());
            if (extraCabinets.length === 0) return;
            const mainContainer = document.querySelector(".main-container");
            const column = document.createElement("div");
            column.className = "cabinet-column dynamic-column";
            column.style.width = "100%";
            let prevBottomU = 48;
            extraCabinets.forEach(cab => {
                cab.column = 1;
                const topU = cab.startU + cab.uCount - 1;
                const bottomU = cab.startU;
                const uColId = `extra_u_${cab.id}`;
                const devColId = `extra_dev_${cab.id}`;
                const marginTop = (prevBottomU - topU - 1) * U_HEIGHT;
                prevBottomU = bottomU;
                const card = document.createElement("div");
                card.className = "cabinet-card extra-cabinet-card";
                card.dataset.cabId = cab.id;
                card.style.marginTop = marginTop + "px";
                card.innerHTML = `
                    <div class="cab-title-wrap">
                        <div class="cab-title" data-cab-id="${cab.id}">${cab.name}</div>
                        <button class="cab-del-btn" onclick="deleteExtraCabinet('${cab.id}')" title="删除此机柜">✕</button>
                    </div>
                    <div class="cabinet">
                        <div class="u-col" id="${uColId}"></div>
                        <div class="dev-col" id="${devColId}"></div>
                    </div>
                `;
                column.appendChild(card);
            });
            mainContainer.appendChild(column);
            extraCabinets.forEach(cab => {
                const topU = cab.startU + cab.uCount - 1;
                const bottomU = cab.startU;
                const uColId = `extra_u_${cab.id}`;
                const devColId = `extra_dev_${cab.id}`;
                renderUColumn(uColId, topU, bottomU);
                renderDeviceColumn(devColId, cab.devices, topU, bottomU, cab.id);
            });
        }

        function openAddCabModal() {
            document.getElementById("addCabName").value = "新增机柜";
            document.getElementById("addCabUCount").value = 47;
            document.getElementById("addCabStartU").value = 1;
            document.getElementById("addCabMask").style.display = "flex";
        }

        function closeAddCabModal() {
            document.getElementById("addCabMask").style.display = "none";
        }

        function getOccupiedRangesForColumn(colIdx) {
            const ranges = [];
            if (colIdx === 0) {
                for (let dev of frontDevBlocks) {
                    ranges.push({ bottom: dev.endU, top: dev.startU });
                }
            }
            if (colIdx === 1) {
                for (let dev of sideDevBlocks) {
                    ranges.push({ bottom: dev.endU, top: dev.startU });
                }
                for (let dev of sideRightBlocks) {
                    ranges.push({ bottom: dev.endU, top: dev.startU });
                }
            }
            for (let cab of extraCabinets) {
                if (cab.column === colIdx) {
                    ranges.push({ bottom: cab.startU, top: cab.startU + cab.uCount - 1 });
                }
            }
            ranges.sort((a, b) => a.bottom - b.bottom);
            const merged = [];
            for (let range of ranges) {
                if (merged.length === 0) {
                    merged.push(range);
                } else {
                    const last = merged[merged.length - 1];
                    if (range.bottom <= last.top + 1) {
                        last.top = Math.max(last.top, range.top);
                    } else {
                        merged.push(range);
                    }
                }
            }
            return merged;
        }

        function findAvailableUPosition(colIdx, uCount) {
            const occupied = getOccupiedRangesForColumn(colIdx);
            let candidateStart = 1;
            while (candidateStart + uCount - 1 <= 47) {
                const candidateTop = candidateStart + uCount - 1;
                let conflict = false;
                for (let range of occupied) {
                    if (!(candidateTop < range.bottom || candidateStart > range.top)) {
                        conflict = true;
                        candidateStart = range.top + 1;
                        break;
                    }
                }
                if (!conflict) {
                    return candidateStart;
                }
            }
            return null;
        }

        function hasColumnConflict(colIdx, startU, uCount) {
            const occupied = getOccupiedRangesForColumn(colIdx);
            const topU = startU + uCount - 1;
            for (let range of occupied) {
                if (!(topU < range.bottom || startU > range.top)) {
                    return true;
                }
            }
            return false;
        }

        function getMaxColumnIndex() {
            let maxCol = 1;
            for (let cab of extraCabinets) {
                if (cab.column != null && cab.column > maxCol) {
                    maxCol = cab.column;
                }
            }
            return maxCol;
        }

        function confirmAddCab() {
            try {
                const name = document.getElementById("addCabName").value.trim() || "新增机柜";
                const uCount = parseInt(document.getElementById("addCabUCount").value) || 47;
                const startU = parseInt(document.getElementById("addCabStartU").value) || 1;

                if (uCount < 1 || uCount > 47) {
                    alert("机柜U数必须在1-47之间");
                    return;
                }
                if (startU < 1 || startU > 47) {
                    alert("起始U位必须在1-47之间");
                    return;
                }
                const topU = startU + uCount - 1;
                if (topU > 47) {
                    alert(`起始U位${startU}往上${uCount}U后超出47U上限，请调小起始U位或减小U数`);
                    return;
                }

                const maxCol = getMaxColumnIndex();
                const newCol = maxCol + 1;

                if (hasColumnConflict(newCol, startU, uCount)) {
                    const availStart = findAvailableUPosition(newCol, uCount);
                    if (availStart !== null) {
                        const newCab = {
                            id: "cab_" + Date.now(),
                            name: name,
                            uCount: uCount,
                            startU: availStart,
                            alignTo: "front",
                            position: "right",
                            column: newCol,
                            devices: []
                        };
                        extraCabinets.push(newCab);
                        saveStorage();
                        renderAll();
                        closeAddCabModal();
                        alert(`机柜「${name}」已创建在列${newCol}，起始U位${availStart}U（因原位置冲突自动调整）`);
                        return;
                    } else {
                        alert(`在右侧新列中找不到足够的连续空闲U位（需要${uCount}U），请调整起始U位或U数`);
                        return;
                    }
                }

                const newCab = {
                    id: "cab_" + Date.now(),
                    name: name,
                    uCount: uCount,
                    startU: startU,
                    alignTo: "front",
                    position: "right",
                    column: newCol,
                    devices: []
                };
                extraCabinets.push(newCab);
                saveStorage();
                renderAll();
                closeAddCabModal();
                alert(`机柜「${name}」已创建在列${newCol}，起始U位${startU}U`);
            } catch (e) {
                alert("创建机柜出错：" + e.message + "\n" + e.stack);
            }
        }

        document.addEventListener("click", function(e) {
            const title = e.target.closest(".cab-title");
            if (!title) return;
            if (title.getAttribute("contenteditable") === "true") return;
            title.setAttribute("contenteditable", "true");
            title.focus();
            const range = document.createRange();
            range.selectNodeContents(title);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        });

        document.addEventListener("blur", function(e) {
            const title = e.target.closest(".cab-title");
            if (!title || title.getAttribute("contenteditable") !== "true") return;
            title.setAttribute("contenteditable", "false");
            const newName = title.innerText.trim() || "未命名机柜";
            title.innerText = newName;
            const cabId = title.dataset.cabId;
            if (cabId === "front") {
                frontCabName = newName;
            } else if (cabId === "side") {
                sideCabName = newName;
            } else if (cabId) {
                const cab = extraCabinets.find(c => c.id === cabId);
                if (cab) cab.name = newName;
            }
            saveStorage();
        }, true);

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                const addMask = document.getElementById("addCabMask");
                if (addMask && addMask.style.display === "flex") {
                    closeAddCabModal();
                }
                if (modalMask.style.display === "flex") {
                    closeModal();
                }
            }
        });

        loadStorage();
        renderAll();
    </script>
</body>
